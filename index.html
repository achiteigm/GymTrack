<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymTrack</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymTrack">
  
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0d1117">
  
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --accent: #38bdf8;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --success: #238636;
      --success-border: #2ea043;
      --input-bg: #0d1117;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding: 0.5rem 0;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset:active {
      background: var(--border);
    }

    /* Tab-uri Navigare */
    .nav {
      display: flex;
      gap: 0.5rem;
      background: var(--card-bg);
      padding: 5px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 1.25rem;
    }

    .nav button {
      flex: 1;
      padding: 0.65rem 0.2rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .nav button.active {
      background: var(--accent);
      color: #000;
    }

    /* Card Exercițiu */
    .exercise-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1rem;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .exercise-card.completed {
      border-color: var(--success-border);
      background: rgba(35, 134, 54, 0.08);
    }

    .exercise-header {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    /* Zona Cadrului pentru Imagine Animat/GIF */
    .gif-frame {
      width: 90px;
      height: 90px;
      min-width: 90px;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .exercise-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .exercise-info {
      flex: 1;
    }

    .exercise-info h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: var(--text);
    }

    .exercise-info p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    /* Zona de Control: Greutate & Bifa */
    .tracker-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .weight-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .weight-box span {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .weight-input {
      width: 85px;
      padding: 0.45rem 0.6rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.9rem;
      text-align: center;
      outline: none;
    }

    .weight-input:focus {
      border-color: var(--accent);
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .checkbox-container input {
      width: 20px;
      height: 20px;
      accent-color: var(--success-border);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>GymTrack</h1>
      <button class="btn-reset" onclick="resetBife()">Resetare</button>
    </div>
    
    <div class="nav" id="day-nav"></div>
    <div id="exercise-list"></div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    const EX_FOLDERS = {
      legPress: "Leg_Press",
      gobletSquat: "Goblet_Squat",
      hyperextension: "Hyperextension_Back_Extension",
      legExtension: "Leg_Extensions",
      abductor: "Thigh_Abductor",
      calfRaise: "Standing_Calf_Raises",
      machineCrunch: "Ab_Crunch_Machine",
      latPulldown: "Wide-Grip_Lat_Pulldown",
      chestSupportedRow: "Bent_Over_Two-Dumbbell_Row",
      chestPress: "Machine_Bench_Press",
      shoulderPress: "Seated_Dumbbell_Press",
      lateralRaise: "Side_Lateral_Raise",
      reverseFly: "Reverse_Flyes",
      deadBug: "Dead_Bug",
      pecDeck: "Butterfly",
      tricepsPushdown: "Triceps_Pushdown_-_Rope_Attachment",
      bicepsCurl: "Dumbbell_Bicep_Curl",
      pallofPress: "Pallof_Press"
    };

    const DAYS = [
      {
        id: "d1", title: "Picioare + Abdomen", label: "Ziua 1", exercises: [
          ["Presă pentru picioare", 4, "10-12", EX_FOLDERS.legPress, "legPress"],
          ["Goblet Squat", 3, "10", EX_FOLDERS.gobletSquat, "gobletSquat"],
          ["Extensii lombare la bancă 45°", 3, "12-15", EX_FOLDERS.hyperextension, "hyperextension"],
          ["Extensii cvadriceps la aparat", 3, "12-15", EX_FOLDERS.legExtension, "legExtension"],
          ["Abductor la aparat", 3, "15-20", EX_FOLDERS.abductor, "abductor"],
          ["Ridicări pe vârfuri la aparat", 3, "15-20", EX_FOLDERS.calfRaise, "calfRaise"],
          ["Crunch la aparat", 3, "12-15", EX_FOLDERS.machineCrunch, "machineCrunch"]
        ]
      },
      {
        id: "d2", title: "Piept + Spate + Umeri + Core", label: "Ziua 2", exercises: [
          ["Lat Pulldown", 3, "10-12", EX_FOLDERS.latPulldown, "latPulldown"],
          ["Ramat sprijinit pe piept", 3, "10-12", EX_FOLDERS.chestSupportedRow, "chestSupportedRow"],
          ["Presă piept la aparat", 3, "10-12", EX_FOLDERS.chestPress, "chestPress"],
          ["Presă umeri la aparat", 3, "10-12", EX_FOLDERS.shoulderPress, "shoulderPress"],
          ["Ridicări laterale cu gantere", 3, "15", EX_FOLDERS.lateralRaise, "lateralRaise"],
          ["Reverse Pec Deck", 3, "12-15", EX_FOLDERS.reverseFly, "reverseFly"],
          ["Dead Bug", 3, "10-12 / parte", EX_FOLDERS.deadBug, "deadBug"]
        ]
      },
      {
        id: "d3", title: "Full Body + Brațe", label: "Ziua 3", exercises: [
          ["Presă pentru picioare", 3, "12", EX_FOLDERS.legPress, "legPress_d3"],
          ["Lat Pulldown priză îngustă", 3, "10-12", EX_FOLDERS.latPulldown, "latPulldown_d3"],
          ["Ramat la cablu", 3, "10-12", EX_FOLDERS.chestSupportedRow, "chestRow_d3"],
          ["Presă piept înclinată", 3, "10-12", EX_FOLDERS.chestPress, "chestPress_d3"],
          ["Pec Deck", 3, "12-15", EX_FOLDERS.pecDeck, "pecDeck"],
          ["Extensii triceps la scripete", 3, "12-15", EX_FOLDERS.tricepsPushdown, "tricepsPushdown"],
          ["Flexii biceps la cablu", 3, "12-15", EX_FOLDERS.bicepsCurl, "bicepsCurl"],
          ["Pallof Press la cablu", 3, "10-12 / parte", EX_FOLDERS.pallofPress, "pallofPress"]
        ]
      }
    ];

    let activeDay = "d1";
    let animationInterval = null;

    function renderNav() {
      const navContainer = document.getElementById("day-nav");
      navContainer.innerHTML = DAYS.map(day => `
        <button class="${day.id === activeDay ? 'active' : ''}" onclick="selectDay('${day.id}')">
          ${day.label}
        </button>
      `).join("");
    }

    function renderExercises() {
      const listContainer = document.getElementById("exercise-list");
      const currentDayData = DAYS.find(d => d.id === activeDay);
      
      listContainer.innerHTML = currentDayData.exercises.map((ex, index) => {
        const folderName = ex[3];
        const exKey = ex[4];
        const initialSrc = `./exercises/${folderName}/0.jpg`;
        
        const savedWeight = localStorage.getItem(`gt_weight_${exKey}`) || '';
        const isDone = localStorage.getItem(`gt_done_${exKey}`) === 'true';

        return `
          <div class="exercise-card ${isDone ? 'completed' : ''}" id="card-${exKey}">
            <div class="exercise-header">
              <div class="gif-frame">
                <img class="exercise-img" 
                     id="img-${index}"
                     src="${initialSrc}" 
                     data-folder="${folderName}" 
                     data-frame="0" 
                     onerror="this.onerror=null; this.src='https://via.placeholder.com/90/0d1117/38bdf8?text=GymTrack';"
                     alt="${ex[0]}">
              </div>
              <div class="exercise-info">
                <h3>${ex[0]}</h3>
                <p><strong>Serii:</strong> ${ex[1]} | <strong>Repetări:</strong> ${ex[2]}</p>
              </div>
            </div>
            
            <div class="tracker-controls">
              <div class="weight-box">
                <span>Greutate:</span>
                <input type="text" 
                       class="weight-input" 
                       placeholder="kg" 
                       value="${savedWeight}"
                       onkeyup="saveWeight('${exKey}', this.value)">
              </div>
              <label class="checkbox-container">
                <input type="checkbox" 
                       ${isDone ? 'checked' : ''} 
                       onchange="toggleDone('${exKey}', this.checked)">
                Efectuat
              </label>
            </div>
          </div>
        `;
      }).join("");

      startAnimation();
    }

    function saveWeight(key, val) {
      localStorage.setItem(`gt_weight_${key}`, val);
    }

    function toggleDone(key, isChecked) {
      localStorage.setItem(`gt_done_${key}`, isChecked);
      const card = document.getElementById(`card-${key}`);
      if (card) {
        card.classList.toggle('completed', isChecked);
      }
    }

    function resetBife() {
      if (confirm("Resetezi bifele pentru o nouă zi de antrenament?")) {
        Object.keys(localStorage).forEach(key => {
          if (key.startsWith('gt_done_')) {
            localStorage.removeItem(key);
          }
        });
        renderExercises();
      }
    }

    function startAnimation() {
      if (animationInterval) clearInterval(animationInterval);

      animationInterval = setInterval(() => {
        const images = document.querySelectorAll('.exercise-img');
        images.forEach(img => {
          const folder = img.getAttribute('data-folder');
          const currentFrame = img.getAttribute('data-frame');
          const nextFrame = currentFrame === '0' ? '1' : '0';
          
          if(!img.src.includes('placeholder')) {
            img.src = `./exercises/${folder}/${nextFrame}.jpg`;
            img.setAttribute('data-frame', nextFrame);
          }
        });
      }, 750);
    }

    function selectDay(dayId) {
      activeDay = dayId;
      renderNav();
      renderExercises();
    }

    renderNav();
    renderExercises();
  </script>
</body>
</html>
